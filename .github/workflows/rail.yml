name: rail

# ============================================================
# ORANGE TACO - S7 RAIL - THE RUNNER
#
# ############ WHY THIS LOOPS ############
# GITHUB'S CRON FLOOR IS FIVE MINUTES, AND FIVE MINUTES IS TOO COARSE
# FOR A RUSH. Stock does not drift evenly - it sits perfectly still
# for sixteen hours and then moves in bursts while the registers are
# open. A five-minute window during a lunch rush is long enough to
# sell out an item and keep offering it.
# The floor applies to the TRIGGER, not to what the job does once it
# starts. So this fires every five minutes and LOOPS INSIDE, calling
# stock every STOCK_EVERY seconds until its window is nearly used up.
# Result: sub-minute stock granularity from a five-minute scheduler.
#
# WHAT THE LOOP CANNOT FIX, NAMED: if GitHub is late - and it is
# best-effort, sometimes by fifteen minutes - the gap between windows
# is unpolled. Nothing inside a job can cover time the job did not
# run for. THE WEBHOOK IS THE ANSWER TO THAT, not a shorter interval.
#
# ############ THE SWEEP GOES FIRST, DELIBERATELY ############
# If a late run overlaps the next one, concurrency cancels the older.
# Whatever gets truncated should be the stock loop, NOT paid orders
# reaching the kitchen. So the sweep runs first and finishes in a
# second; the loop then fills the remaining window.
#
# ############ NOTHING IS LOGGED BUT A STATUS CODE ############
# THIS REPOSITORY IS PUBLIC, AND SO ARE ITS RUN LOGS. Our functions
# answer with guest data - rail-sweep names order numbers, rail-inject
# returns guest and ticket names. Printing a response here would
# publish that to the open internet, permanently and searchably.
# So every call uses -o /dev/null and prints ONLY the HTTP status.
# THE COST IS REAL AND ACCEPTED: when something breaks you get a red X
# and a number. THE DATABASE IS WHERE YOU LOOK - rail.sync_runs,
# rail.order_events and rail.receipt_watch carry the detail privately.
# DO NOT ADD RESPONSE LOGGING TO DEBUG SOMETHING. Query the database.
#
# ############ WHERE THE LIVENESS PINGS COME FROM ############
# NOT FROM HERE. rail-stock pings its own healthcheck on full success
# and rail-sweep pings a SEPARATE one, so a dead stock sync and a dead
# sweeper are distinguishable rather than one combined silence.
# rail-heartbeat is a different mechanism - a pollable status endpoint
# that pings nothing - which is why there is no heartbeat step.
#
# ############ THE SECRET THIS HOLDS, AND THE ONE IT DOES NOT ########
# RAIL_CRON_SECRET only. It triggers syncs and sweeps and NOTHING
# ELSE - it cannot capture money, void, refund, or send mail.
# RAIL_INTERNAL_SECRET NEVER LEAVES SUPABASE.
#
# ############ HOW THIS ITSELF STOPS SILENTLY ############
# GitHub DISABLES SCHEDULED WORKFLOWS in a repository with no commit
# activity for 60 days. It emails the owner, and it is exactly the
# failure this design exists to catch. Rely on the switch, not the
# email.
# ============================================================

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  # A late run must not stack on a running one. Cancelling the older
  # is safe because the sweep has already finished by then and stock
  # is idempotent - the next window picks it straight back up.
  group: rail
  cancel-in-progress: true

env:
  STOCK_EVERY: 40        # seconds between stock calls inside the window
  STOCK_WINDOW: 260      # stop looping after this many seconds

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # FIRST, and fast. Paid orders reaching the kitchen outranks
      # everything else in this file.
      - name: sweep
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 \
            -X POST "${{ secrets.RAIL_BASE_URL }}rail-sweep" \
            -H "content-type: application/json" \
            -H "x-rail-cron: ${{ secrets.RAIL_CRON_SECRET }}")
          echo "sweep -> $code"
          test "$code" = "200"

      - name: stock loop
        if: always()
        run: |
          start=$(date +%s)
          n=0; good=0
          while :; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              -X POST "${{ secrets.RAIL_BASE_URL }}rail-stock" \
              -H "x-rail-cron: ${{ secrets.RAIL_CRON_SECRET }}")
            n=$((n+1))
            if [ "$code" = "200" ]; then good=$((good+1)); fi
            echo "stock $n -> $code"
            now=$(date +%s)
            elapsed=$((now-start))
            if [ $((elapsed + STOCK_EVERY)) -ge "$STOCK_WINDOW" ]; then break; fi
            sleep "$STOCK_EVERY"
          done
          echo "stock: $good of $n succeeded"
          # A single transient failure inside a window is not worth a
          # red run - the next call is forty seconds away. The step
          # fails only if EVERY call failed, which means something is
          # actually wrong rather than briefly unlucky.
          test "$good" -gt 0
